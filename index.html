    --map-bg: #f3efe6;
  }

  /* ===== 基础 ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding-bottom: env(safe-area-inset-bottom, 0);
    transition: background .3s ease, color .3s ease;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; }
  h2 { font-size: 18px; letter-spacing: .02em; }
  h3 { font-size: 15px; }
  h4 { font-size: 14px; }
  button { font-family: inherit; }

  main {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 16px 80px;
  }
  section { margin-top: 28px; }
  section > h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg);
    margin-bottom: 12px;
    padding: 0 4px;
  }
  section > h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ===== 顶部"此刻关注"卡片 ===== */
  .next-up {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 130%);
    color: var(--accent-fg);
    margin: 0 auto;
    max-width: var(--maxw);
    padding: 22px 20px 26px;
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--border);
  }
  .next-up::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 80% 20%, rgba(255,255,255,.12) 0%, transparent 50%),
      radial-gradient(circle at 10% 90%, rgba(255,255,255,.08) 0%, transparent 50%);
    pointer-events: none;
  }
  .next-up-label {
    font-size: 12px;
    letter-spacing: .15em;
    text-transform: uppercase;
    opacity: .75;
    margin-bottom: 4px;
  }
  .next-up-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 2px;
    line-height: 1.3;
  }
  .next-up-sub {
    font-size: 12px;
    opacity: .75;
    margin-bottom: 14px;
  }
  .countdown {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .cd-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    flex: 1;
  }
  .cd-num {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.02em;
  }
  .cd-unit {
    font-size: 11px;
    opacity: .8;
    margin-top: 4px;
    letter-spacing: .1em;
  }
  .cd-sep {
    font-size: 24px;
    opacity: .5;
    line-height: 1;
    margin-bottom: 14px;
  }
  .next-up-status {
    margin-top: 12px;
    font-size: 12px;
    opacity: .8;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .next-up-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: .7;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .4; }
    50% { opacity: 1; }
  }

  /* ===== 主题切换 ===== */
  .theme-toggle {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    box-shadow: var(--shadow);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    padding: 0;
  }
  .theme-toggle:active { transform: scale(.95); }

  /* ===== 总览地图 ===== */
  .overview-svg {
    background: var(--map-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 16/9;
    width: 100%;
  }
  .overview-svg svg { width: 100%; height: 100%; display: block; }
  .overview-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--fg-soft);
    padding: 0 4px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  /* ===== 预订卡片 ===== */
  .booking-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .booking-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .booking-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
    letter-spacing: .05em;
  }
  .booking-tag.pending {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .booking-card h3 {
    font-size: 15px;
    margin-bottom: 6px;
  }
  .booking-card .info-row {
    display: flex;
    font-size: 13px;
    margin-top: 4px;
    color: var(--fg-soft);
  }
  .booking-card .info-row .lbl {
    color: var(--muted);
    width: 56px;
    flex-shrink: 0;
  }
  .booking-card .info-row .val {
    flex: 1;
    color: var(--fg);
    word-break: break-all;
  }
  .booking-card a.tel {
    color: var(--accent);
  }

  /* ===== 逐日行程 ===== */
  .day-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .day-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    list-style: none;
  }
  .day-head::-webkit-details-marker { display: none; }
  .day-color {
    width: 4px;
    height: 28px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .day-head-text { flex: 1; min-width: 0; }
  .day-head-text .date {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .1em;
  }
  .day-head-text .title {
    font-size: 15px;
    font-weight: 600;
    margin-top: 1px;
  }
  .day-head-text .route {
    font-size: 12px;
    color: var(--fg-soft);
    margin-top: 1px;
  }
  .day-head .chevron {
    color: var(--muted);
    font-size: 14px;
    transition: transform .25s ease;
  }
  details[open] .day-head .chevron { transform: rotate(90deg); }

  .day-body { padding: 0 0 8px; border-top: 1px solid var(--border-soft); }
  .day-route-toggle {
    display: block;
    width: calc(100% - 32px);
    margin: 12px 16px;
    padding: 8px 12px;
    background: var(--bg-soft);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
  }
  .day-route-toggle:active { background: var(--border-soft); }
  .day-route-svg {
    margin: 0 16px 12px;
    background: var(--map-bg);
    border-radius: var(--radius-sm);
    overflow: hidden;
    aspect-ratio: 16/7;
  }
  .day-route-svg svg { width: 100%; height: 100%; display: block; }
  .day-nav-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 0 16px 12px;
    padding: 10px 12px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
  }
  .day-nav-btn:active { opacity: .85; }

  /* ===== 时间线 ===== */
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline-item {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft);
    position: relative;
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-item::before {
    content: "";
    position: absolute;
    left: 67px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border-soft);
  }
  .timeline-item:last-child::before { display: none; }
  .timeline-time {
    width: 52px;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    line-height: 1.4;
    padding-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .timeline-time .end {
    display: block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    margin-top: 1px;
  }
  .timeline-body { flex: 1; min-width: 0; }
  .timeline-head {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 2px;
  }
  .timeline-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--bg-soft);
    color: var(--fg-soft);
    border: 1px solid var(--border);
    font-weight: 500;
    line-height: 1.4;
  }
  .badge.book {
    background: var(--warn-soft);
    color: var(--warn);
    border-color: transparent;
  }
  .timeline-desc {
    font-size: 12px;
    color: var(--fg-soft);
    margin: 2px 0 0;
    line-height: 1.5;
  }
  .timeline-place {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .map-buttons {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .map-btn {
    display: inline-block;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--bg-soft);
    color: var(--fg);
    border: 1px solid var(--border);
    text-decoration: none;
    line-height: 1.3;
  }
  .map-btn:active { background: var(--border-soft); }
  .map-btn.primary {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: transparent;
  }

  /* ===== 待办 / 贴士 ===== */
  .plain-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .plain-list li {
    position: relative;
    padding: 10px 12px 10px 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--fg);
    box-shadow: var(--shadow);
    line-height: 1.5;
  }
  .plain-list li::before {
    content: "·";
    position: absolute;
    left: 12px;
    top: 7px;
    color: var(--accent);
    font-size: 18px;
    line-height: 1;
  }
  .plain-list li.high {
    border-left: 3px solid var(--warn);
    padding-left: 12px;
  }
  .plain-list li.high::before { display: none; }
  .plain-list li .meta {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
  }
  .tips {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .tips p { margin: 0 0 8px; font-size: 13px; color: var(--fg-soft); line-height: 1.6; }
  .tips p:last-child { margin-bottom: 0; }
  .tips strong { color: var(--fg); font-weight: 600; }

  footer {
    max-width: var(--maxw);
    margin: 32px auto 0;
    padding: 16px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* 窄屏调整 */
  @media (max-width: 380px) {
    .cd-num { font-size: 26px; }
    .next-up-title { font-size: 16px; }
    .timeline-time { width: 44px; font-size: 12px; }
    .timeline-item::before { left: 59px; }
  }
</style>

/* ============================================================
 *  工具函数
 * ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function fmtTime(iso, opts = {}) {
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (opts.dateOnly) {
    return `${d.getMonth()+1}月${d.getDate()}日`;
  }
  if (opts.weekday) {
    const wk = ['日','一','二','三','四','五','六'][d.getDay()];
    return `${hh}:${mm} · 周${wk}`;
  }
  return `${hh}:${mm}`;
}
function fmtDateZh(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function diffParts(targetMs) {
  let s = Math.max(0, Math.floor((targetMs - Date.now()) / 1000));
  const d = Math.floor(s / 86400);
  s -= d * 86400;
  const h = Math.floor(s / 3600);
  s -= h * 3600;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return { d, h, m, s: sec };
}

/* ============================================================
 *  倒计时:找下一个未结束的事件
 * ============================================================ */
function findNextEvent() {
  const now = Date.now();
  // 1) 行程中正在进行
  for (const day of TRIP.days) {
    for (const ev of day.events) {
      const s = +new Date(ev.start), e = +new Date(ev.end);
      if (now >= s && now < e) {
        return { day, ev, mode: "ongoing", endMs: e };
      }
    }
  }
  // 2) 即将开始
  let best = null;
  for (const day of TRIP.days) {
    for (const ev of day.events) {
      const s = +new Date(ev.start);
      if (s > now && (!best || s < best.startMs)) {
        best = { day, ev, mode: "upcoming", startMs: s };
      }
    }
  }
  return best;
}

function pad2(n) { return String(n).padStart(2, '0'); }

function renderNextUp() {
  const next = findNextEvent();
  if (!next) {
    $("#nextTitle").textContent = "行程已结束";
    $("#nextSub").textContent = "期待下次旅行";
    $("#cdDays").textContent = "00";
    $("#cdHours").textContent = "00";
    $("#cdMins").textContent = "00";
    $("#cdSecs").textContent = "00";
    $("#nextStatusText").textContent = "已结束";
    return;
  }
  $("#nextTitle").textContent = next.ev.title;
  const dateObj = new Date(next.ev.start);
  const dateStr = `${dateObj.getMonth()+1}月${dateObj.getDate()}日 ${pad2(dateObj.getHours())}:${pad2(dateObj.getMinutes())}`;
  $("#nextSub").textContent = `${next.day.label} · ${next.day.route} · ${dateStr}`;

  const target = next.mode === "ongoing" ? next.endMs : next.startMs;
  const p = diffParts(target);
  $("#cdDays").textContent = pad2(p.d);
  $("#cdHours").textContent = pad2(p.h);
  $("#cdMins").textContent = pad2(p.m);
  $("#cdSecs").textContent = pad2(p.s);
  $("#nextStatusText").textContent = next.mode === "ongoing" ? "正在进行 · 还剩" : "还有";
}

/* ============================================================
 *  地图唤起
 * ============================================================ */
function mapLinks(lat, lng, name) {
  if (lat == null || lng == null) return [];
  const amap = `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name||'位置')}&src=gandongbei&coordinate=gaode&callnative=1`;
  const bmap = `https://api.map.baidu.com/marker?location=${lat},${lng}&title=${encodeURIComponent(name||'位置')}&content=${encodeURIComponent(name||'')}&output=html&coord_type=gcj02&src=gandongbei`;
  const apple = `https://maps.apple.com/?q=${encodeURIComponent(name||'位置')}&ll=${lat},${lng}`;
  return [
    { name: "高德", url: amap, primary: true },
    { name: "百度", url: bmap },
    { name: "苹果", url: apple }
  ];
}

function mapLinksMulti(points) {
  // 仅高德支持多 via 点
  if (!points || points.length < 2) return null;
  const waypoints = points.slice(1,-1).map(p => `${p.lng},${p.lat}`).join(';');
  const to = points[points.length-1];
  const origin = points[0];
  const params = new URLSearchParams({
    mode: 'car',
    policy: '1',
    src: 'gandongbei',
    coordinate: 'gaode',
    callnative: '1'
  });
  params.set('origin', `${origin.lng},${origin.lat}`);
  params.set('originname', origin.name || '');
  params.set('destination', `${to.lng},${to.lat}`);
  params.set('destinationname', to.name || '');
  if (waypoints) params.set('via', waypoints);
  return `https://uri.amap.com/navigation?${params.toString()}`;
}

/* ============================================================
 *  渲染:逐日行程
 * ============================================================ */
function renderDays() {
  const host = $("#days");
  host.innerHTML = TRIP.days.map((d, i) => {
    const stayLine = d.stay ? `<div class="info-row"><span class="lbl">住</span><span class="val">${d.stay.name}${d.stay.address?' · '+d.stay.address:''}</span></div>` : '';
    return `
    <details class="day-block" ${i===0?'open':''} id="day-${d.id}">
      <summary class="day-head">
        <span class="day-color" style="background:${d.color}"></span>
        <div class="day-head-text">
          <div class="date">10.${i+1} · ${d.weekday} · ${d.label}</div>
          <div class="title">${d.route}</div>
        </div>
        <span class="chevron">›</span>
      </summary>
      <div class="day-body">
        ${d.stay ? `<div class="timeline" style="padding: 10px 16px 4px; border-bottom: 1px solid var(--border-soft);">
          <div class="info-row"><span class="lbl" style="width: 40px; color: var(--muted); font-size: 12px;">夜宿</span><span class="val" style="font-size: 13px;">${d.stay.name}</span></div>
        </div>` : ''}
        <button class="day-route-toggle" data-route-toggle="${d.id}">查看当日路线</button>
        <div class="day-route-svg" data-route-svg="${d.id}" hidden></div>
        <a class="day-nav-btn" data-daynav="${d.id}" href="#" onclick="event.preventDefault();">一键规划全天路线(高德)</a>
        <ol class="timeline">
          ${d.events.map(ev => {
            const ml = mapLinks(ev.lat, ev.lng, ev.place);
            const placeLine = ev.place ? `<div class="timeline-place">📍 ${ev.place}</div>` : '';
            const bookTag = ev.needsBooking ? `<span class="badge book">需订${ev.bookingNote?' · '+ev.bookingNote:''}</span>` : '';
            return `
            <li class="timeline-item">
              <div class="timeline-time">${fmtTime(ev.start)}<span class="end">${fmtTime(ev.end)}</span></div>
              <div class="timeline-body">
                <div class="timeline-head">
                  <span class="timeline-title">${ev.title}</span>
                  ${ev.transport?`<span class="badge">${ev.transport}</span>`:''}
                  ${bookTag}
                </div>
                ${ev.desc?`<p class="timeline-desc">${ev.desc}</p>`:''}
                ${placeLine}
                ${ml.length?`<div class="map-buttons">${ml.map(m => `<a class="map-btn ${m.primary?'primary':''}" href="${m.url}">${m.primary?'🗺️ ':''}${m.name}地图</a>`).join('')}</div>`:''}
              </div>
            </li>`;
          }).join('')}
        </ol>
      </div>
    </details>`;
  }).join('');

  // 当日路线展开
  $$('[data-route-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.routeToggle;
      const wrap = $(`[data-route-svg="${id}"]`);
      if (wrap.hidden) {
        wrap.innerHTML = renderDayRouteSVG(id);
        wrap.hidden = false;
        btn.textContent = "收起当日路线";
      } else {
        wrap.hidden = true;
        btn.textContent = "查看当日路线";
      }
    });
  });

  // 一键全天导航
  $$('[data-daynav]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const id = a.dataset.daynav;
      const d = TRIP.days.find(x => x.id === id);
      const points = d.events
        .map(ev => {
          const lat = ev.latDest ?? ev.lat;
          const lng = ev.lngDest ?? ev.lng;
          return lat != null ? { lat, lng, name: ev.place || ev.title } : null;
        })
        .filter(Boolean);
      if (points.length < 2) {
        // 不足 2 个坐标,打开第一个点的 marker
        if (points[0]) window.location.href = mapLinks(points[0].lat, points[0].lng, points[0].name)[0].url;
        return;
      }
      const url = mapLinksMulti(points);
      if (url) window.location.href = url;
    });
  });
}

/* ============================================================
 *  渲染:总览地图(手绘感 SVG)
 *  5 个主点:杭州西 → 上饶 → 婺源 → 景德镇 → 葛仙山/铜钹山
 *  按天用不同颜色画连线
 * ============================================================ */
const PLACES = {
  hz:  { name: "杭州西",   lat: 30.2919, lng: 120.0253 },
  sr:  { name: "上饶",     lat: 28.4912, lng: 117.9522 },
  wy:  { name: "婺源",     lat: 29.2541, lng: 117.8611 },
  jdz: { name: "景德镇",   lat: 29.2940, lng: 117.2080 },
  gxs: { name: "葛仙山",   lat: 28.1316, lng: 117.6811 },
  tbs: { name: "铜钹山",   lat: 28.3617, lng: 118.1861 },
  hl:  { name: "篁岭",     lat: 29.3519, lng: 117.8358 },
  wnz: { name: "婺女洲",   lat: 29.2651, lng: 117.8671 },
  taog: { name: "陶溪川",  lat: 29.2955, lng: 117.2196 }
};

const ROUTE_SEQ = {
  d1: { color: "#c14b3d", path: ["hz","sr","gxs"] },
  d2: { color: "#d49a3a", path: ["gxs","tbs","sr"] },
  d3: { color: "#5b8c5a", path: ["sr","wy","hl","wnz","wy"] },
  d4: { color: "#4a6b8a", path: ["wy","jdz","jdz","jdz"] },
  d5: { color: "#7a5a8c", path: ["jdz","jdz","jdz","hz"] }
};

function project(lat, lng, w, h) {
  // 简化的经纬度 → 像素投影(经度横,纬度纵)
  const minLng = 117.0, maxLng = 120.5;
  const minLat = 27.9, maxLat = 30.5;
  const x = ((lng - minLng) / (maxLng - minLng)) * w;
  const y = h - ((lat - minLat) / (maxLat - minLat)) * h;
  return [x, y];
}

function renderOverviewSVG() {
  const W = 800, H = 450;
  const stops = [
    { key: "hz",  label: "杭州西" },
    { key: "sr",  label: "上饶" },
    { key: "wy",  label: "婺源" },
    { key: "jdz", label: "景德镇" },
    { key: "gxs", label: "葛仙山" },
    { key: "tbs", label: "铜钹山" },
    { key: "hl",  label: "篁岭" },
    { key: "wnz", label: "婺女洲" },
    { key: "taog",label: "陶溪川" }
  ];
  const points = {};
  stops.forEach(s => {
    const p = PLACES[s.key];
    const [x, y] = project(p.lat, p.lng, W, H);
    points[s.key] = { x, y, label: s.label, name: p.name };
  });

  const lines = TRIP.days.map(d => {
    const seq = ROUTE_SEQ[d.id].path;
    const segs = [];
    for (let i = 0; i < seq.length - 1; i++) {
      const a = points[seq[i]], b = points[seq[i+1]];
      if (!a || !b) continue;
      // 手绘感:加一点弯曲
      const mx = (a.x + b.x) / 2 + (Math.random() - 0.5) * 6;
      const my = (a.y + b.y) / 2 + (Math.random() - 0.5) * 6;
      segs.push(`<path d="M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}" stroke="${d.color}" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>`);
    }
    return segs.join('');
  }).join('');

  // 主要节点
  const mainDots = ["hz","sr","wy","jdz"].map(k => {
    const p = points[k];
    return `<g><circle cx="${p.x}" cy="${p.y}" r="9" fill="var(--bg)" stroke="var(--accent)" stroke-width="3"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fg)">${p.label}</text></g>`;
  }).join('');

  // 次要节点
  const subDots = ["gxs","tbs","hl","wnz","taog"].map(k => {
    const p = points[k];
    return `<g><circle cx="${p.x}" cy="${p.y}" r="5" fill="var(--bg-soft)" stroke="var(--fg-soft)" stroke-width="1.5"/><text x="${p.x+8}" y="${p.y+4}" font-size="10" fill="var(--fg-soft)">${p.label}</text></g>`;
  }).join('');

  // 装饰:模拟省份边界
  const decor = `
    <rect x="2" y="2" width="${W-4}" height="${H-4}" rx="14" fill="none" stroke="var(--border)" stroke-width="1"/>
    <text x="${W-16}" y="${H-10}" text-anchor="end" font-size="10" fill="var(--muted)">赣东北 2026 · 概览(非精确地图)</text>
  `;

  $("#overviewSvg").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${lines}${mainDots}${subDots}${decor}</svg>`;

  $("#overviewLegend").innerHTML = TRIP.days.map(d =>
    `<span class="legend-item"><span class="legend-dot" style="background:${d.color}"></span>${d.label} · ${d.route}</span>`
  ).join('');
}

/* ============================================================
 *  渲染:当日路线小图
 * ============================================================ */
function renderDayRouteSVG(dayId) {
  const d = TRIP.days.find(x => x.id === dayId);
  if (!d) return '';
  const stops = d.events
    .map(ev => ({ name: ev.place, lat: ev.lat, lng: ev.lng }))
    .filter(p => p.lat != null);
  if (stops.length < 2) return '<svg viewBox="0 0 400 200"></svg>';

  const lats = stops.map(s => s.lat);
  const lngs = stops.map(s => s.lng);
  const minLat = Math.min(...lats) - 0.05, maxLat = Math.max(...lats) + 0.05;
  const minLng = Math.min(...lngs) - 0.05, maxLng = Math.max(...lngs) + 0.05;
  const W = 400, H = 200;
  const proj = (lat, lng) => [
    ((lng - minLng) / (maxLng - minLng || 1)) * (W - 60) + 30,
    H - 30 - ((lat - minLat) / (maxLat - minLat || 1)) * (H - 60)
  ];

  const path = stops.map((s, i) => {
    const [x, y] = proj(s.lat, s.lng);
    return { x, y, name: s.name };
  });
  const pathD = path.map((p, i) => `${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');
  const dots = path.map((p, i) =>
    `<g><circle cx="${p.x}" cy="${p.y}" r="5" fill="${d.color}" stroke="var(--bg)" stroke-width="2"/><text x="${p.x+8}" y="${p.y+4}" font-size="10" fill="var(--fg)">${i+1}. ${p.name||''}</text></g>`
  ).join('');

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <path d="${pathD}" stroke="${d.color}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="0" opacity="0.8"/>
    ${dots}
  </svg>`;
}

/* ============================================================
 *  主题切换
 * ============================================================ */
function initTheme() {
  const saved = localStorage.getItem('trip-theme');
  const btn = $("#themeToggle");
  const apply = (mode) => {
    document.documentElement.setAttribute('data-theme', mode);
    btn.textContent = mode === 'dark' ? '☀' : '☾';
  };
  if (saved) { apply(saved); }
  else { document.documentElement.setAttribute('data-theme', 'auto'); btn.textContent = '◐'; }

  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    let next;
    if (cur === 'auto') next = 'light';
    else if (cur === 'light') next = 'dark';
    else next = 'auto';
    localStorage.setItem('trip-theme', next);
    apply(next);
  });
}

/* ============================================================
 *  init
 * ============================================================ */
function init() {
  renderNextUp();
  renderBookings();
  renderDays();
  renderOverviewSVG();
  renderTodo();
  renderTips();
  initTheme();
  setInterval(renderNextUp, 1000);
}
document.addEventListener('DOMContentLoaded', init);
