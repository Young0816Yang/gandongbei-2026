  /* ===== 基础 ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {

  }

  /* ===== 顶部"此刻关注"卡片 + 灵动岛 ===== */
  .next-up {
    background: linear-gradient(135deg, var(--accent) 0%, #ffcb3d 55%, var(--accent-soft) 130%);
    color: var(--accent-fg);
    margin: 0 auto;
    max-width: var(--maxw);
    padding: 22px 20px 26px;
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--border);
    transition: padding .3s ease, border-radius .3s ease, margin .3s ease;
  }
  .next-up::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 80% 20%, rgba(255,255,255,.25) 0%, transparent 50%),
      radial-gradient(circle at 10% 90%, rgba(255,255,255,.15) 0%, transparent 50%);
    pointer-events: none;
  }
  .next-up-label {
    font-size: 12px;
    letter-spacing: .15em;

    opacity: .7;

  }
  .next-up-title {

    font-weight: 700;
    margin-bottom: 2px;
    line-height: 1.3;
    transition: font-size .25s ease;
  }
  .next-up-sub {
    font-size: 12px;
    opacity: .75;
    margin-bottom: 14px;
    transition: opacity .25s ease, margin .25s ease;
  }
  .countdown {

    gap: 4px;

  .cd-num {

  }
  .cd-unit {

    margin-top: 4px;

  }
  .cd-sep {

    margin-bottom: 15px;
  }
  .next-up-status {
    margin-top: 12px;

    align-items: center;
    gap: 6px;
  }
  .next-up-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: .7;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .4; }
    50% { opacity: 1; }
  }

  /* 灵动岛:下拉后缩小悬浮 */
  .next-up.is-island {
    position: fixed;

    max-width: 380px;
    width: auto;
    min-width: 220px;

  .next-up.is-island::before { display: none; }
  .next-up.is-island .next-up-label,
  .next-up.is-island .next-up-status,
  .next-up.is-island .next-up-sub {

  .next-up.is-island .next-up-title {

  .next-up.is-island .cd-block {

  }
  .next-up.is-island .cd-num {
    font-size: 15px;
  }
  .next-up.is-island .cd-unit {
    font-size: 10px;
    margin-top: 0;
  }
  .next-up.is-island .cd-sep {
    font-size: 13px;
    margin-bottom: 0;
  }
  /* 展开态(点击岛后) */
  .next-up.is-island.is-expanded {

  .next-up.is-island.is-expanded .next-up-label { display: block; }

  .next-up.is-island.is-expanded .next-up-title { font-size: 18px; white-space: normal; }

  .next-up.is-island.is-expanded .cd-num { font-size: 34px; }
  .next-up.is-island.is-expanded .cd-unit { font-size: 11px; margin-top: 4px; }

  /* ===== 主题切换 ===== */

  /* ===== 总览地图 ===== */

  .overview-days .day-chip {

  .overview-days .day-chip.active {

  /* ===== 预订卡片 ===== */
  .booking-tabs {
    display: flex;

    padding: 4px;
    border-radius: 999px;

  }
  .booking-tab {
    flex: 1;

  }
  .booking-tab.active {
    background: var(--card);

  }
  .booking-tab .count {
    display: inline-block;

  }
  .booking-empty {

  }
  .todo-toggle {

    cursor: pointer;
    font-weight: 500;
    line-height: 1.4;
  }
  .todo-toggle:active { transform: scale(.96); }
  #todoSection.is-collapsed #todo { display: none; }
  #todoSection.is-collapsed .todo-toggle::before { content: "展开"; }
  #todoSection:not(.is-collapsed) .todo-toggle::before { content: "收起"; }
  .booking-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .booking-card-head {
    display: flex;

    font-weight: 500;
    letter-spacing: .05em;
  }
  .booking-tag.pending {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .booking-card h3 {
    font-size: 15px;

  }
  .booking-card .info-row {
    display: flex;
    font-size: 13px;

  }
  .booking-card .info-row .lbl {
    color: var(--muted);
    width: 56px;
    flex-shrink: 0;
  }
  .booking-card .info-row .val {
    flex: 1;
    color: var(--fg);
    word-break: break-all;
  }
  .booking-card a.tel {

  }

  /* ===== 逐日行程 ===== */
  .day-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .day-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    list-style: none;
  }
  .day-head::-webkit-details-marker { display: none; }
  .day-color {
    width: 4px;
    height: 28px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .day-head-text { flex: 1; min-width: 0; }
  .day-head-text .date {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .1em;
  }
  .day-head-text .title {
    font-size: 15px;
    font-weight: 600;
    margin-top: 1px;
  }
  .day-head-text .route {
    font-size: 12px;
    color: var(--fg-soft);
    margin-top: 1px;
  }
  .day-head .chevron {
    color: var(--muted);
    font-size: 14px;
    transition: transform .25s ease;
  }
  details[open] .day-head .chevron { transform: rotate(90deg); }

  .day-body { padding: 0 0 8px; border-top: 1px solid var(--border-soft); }
  .day-route-toggle {
    display: block;
    width: calc(100% - 32px);
    margin: 12px 16px;
    padding: 8px 12px;
    background: var(--bg-soft);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
  }
  .day-route-toggle:active { background: var(--border-soft); }
  .day-route-svg {
    margin: 0 16px 12px;
    background: var(--map-bg);
    border-radius: var(--radius-sm);
    overflow: hidden;
    position: relative;
  }
  /* 当日路线图:固定宽高比,避免跨城日被拉成超长图 */
  .day-route-svg .map-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;          /* 横向矩形,适合手机 */
    overflow: hidden;
    background: var(--map-bg);
    touch-action: none;            /* 关键:禁用浏览器默认手势,我们自己接管 */
    user-select: none;
    -webkit-user-select: none;
  }
  .day-route-svg .map-stage > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  .day-route-svg .map-stage > svg.dragging { cursor: grabbing; }
  /* 缩放控件:右上角浮动 */
  .map-zoom-controls {
    position: absolute;
    right: 8px;
    bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 2;
  }
  .map-zoom-controls button {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .map-zoom-controls button:active { background: var(--bg-soft); }
  .map-zoom-hint {
    position: absolute;
    left: 8px;
    bottom: 8px;
    z-index: 2;
    font-size: 11px;
    color: var(--fg-soft);
    background: rgba(255,253,244,.85);
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    .map-zoom-hint { background: rgba(36,31,16,.85); }
  }
  .day-nav-btn {
    display: block;
    width: calc(100% - 32px);

    padding: 10px 12px;
    background: var(--accent);

    border: none;

    font-size: 13px;
    font-weight: 500;
    text-align: center;

  .timeline { list-style: none; padding: 0; margin: 0; }

  .timeline-item::before {
    content: "";
    position: absolute;
    left: 67px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border-soft);
  }
  .timeline-item:last-child::before { display: none; }
  .timeline-time {
    width: 52px;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);

    padding-top: 1px;

  }

    font-size: 11px;
    font-weight: 400;
    margin-top: 1px;
  }
  .timeline-body { flex: 1; min-width: 0; }
  .timeline-head {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 2px;
  }
  .timeline-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--bg-soft);
    color: var(--fg-soft);
    border: 1px solid var(--border);
    font-weight: 500;
    line-height: 1.4;
  }

/* ============================================================
 *  工具函数
 * ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function fmtTime(iso, opts = {}) {
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (opts.dateOnly) {
    return `${d.getMonth()+1}月${d.getDate()}日`;
  }
  if (opts.weekday) {
    const wk = ['日','一','二','三','四','五','六'][d.getDay()];
    return `${hh}:${mm} · 周${wk}`;
  }
  return `${hh}:${mm}`;
}
function fmtDateZh(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function diffParts(targetMs) {
  let s = Math.max(0, Math.floor((targetMs - Date.now()) / 1000));
  const d = Math.floor(s / 86400);
  s -= d * 86400;
  const h = Math.floor(s / 3600);
  s -= h * 3600;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return { d, h, m, s: sec };
}

/* ============================================================
 *  倒计时:找下一个未结束的事件
 * ============================================================ */
function findNextEvent() {
  const now = Date.now();
  // 1) 行程中正在进行
  for (const day of TRIP.days) {
    for (const ev of day.events) {
      const s = +new Date(ev.start), e = +new Date(ev.end);
      if (now >= s && now < e) {
        return { day, ev, mode: "ongoing", endMs: e };
      }
    }
  }
  // 2) 即将开始
  let best = null;
  for (const day of TRIP.days) {
    for (const ev of day.events) {
      const s = +new Date(ev.start);
      if (s > now && (!best || s < best.startMs)) {
        best = { day, ev, mode: "upcoming", startMs: s };
      }
    }
  }
  return best;
}

function pad2(n) { return String(n).padStart(2, '0'); }

function renderNextUp() {
  const next = findNextEvent();
  if (!next) {
    $("#nextTitle").textContent = "行程已结束";
    $("#nextSub").textContent = "期待下次旅行";
    $("#cdDays").textContent = "00";
    $("#cdHours").textContent = "00";
    $("#cdMins").textContent = "00";
    $("#cdSecs").textContent = "00";
    $("#nextStatusText").textContent = "已结束";
    return;
  }
  $("#nextTitle").textContent = next.ev.title;
  const dateObj = new Date(next.ev.start);
  const dateStr = `${dateObj.getMonth()+1}月${dateObj.getDate()}日 ${pad2(dateObj.getHours())}:${pad2(dateObj.getMinutes())}`;
  $("#nextSub").textContent = `${next.day.label} · ${next.day.route} · ${dateStr}`;

  const target = next.mode === "ongoing" ? next.endMs : next.startMs;
  const p = diffParts(target);
  $("#cdDays").textContent = pad2(p.d);
  $("#cdHours").textContent = pad2(p.h);
  $("#cdMins").textContent = pad2(p.m);
  $("#cdSecs").textContent = pad2(p.s);
  $("#nextStatusText").textContent = next.mode === "ongoing" ? "正在进行 · 还剩" : "还有";
}

/* ============================================================
 *  地图唤起
 * ============================================================ */
function mapLinks(lat, lng, name) {
  if (lat == null || lng == null) return [];
  const amap = `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name||'位置')}&src=gandongbei&coordinate=gaode&callnative=1`;
  const bmap = `https://api.map.baidu.com/marker?location=${lat},${lng}&title=${encodeURIComponent(name||'位置')}&content=${encodeURIComponent(name||'')}&output=html&coord_type=gcj02&src=gandongbei`;
  const apple = `https://maps.apple.com/?q=${encodeURIComponent(name||'位置')}&ll=${lat},${lng}`;
  return [
    { name: "高德", url: amap, primary: true },
    { name: "百度", url: bmap },
    { name: "苹果", url: apple }
  ];
}

function mapLinksMulti(points) {
  // 仅高德支持多 via 点
  if (!points || points.length < 2) return null;
  const waypoints = points.slice(1,-1).map(p => `${p.lng},${p.lat}`).join(';');
  const to = points[points.length-1];
  const origin = points[0];
  const params = new URLSearchParams({
    mode: 'car',
    policy: '1',
    src: 'gandongbei',
    coordinate: 'gaode',
    callnative: '1'
  });
  params.set('origin', `${origin.lng},${origin.lat}`);
  params.set('originname', origin.name || '');
  params.set('destination', `${to.lng},${to.lat}`);
  params.set('destinationname', to.name || '');
  if (waypoints) params.set('via', waypoints);
  return `https://uri.amap.com/navigation?${params.toString()}`;
}

          const lat = ev.latDest ?? ev.lat;
          const lng = ev.lngDest ?? ev.lng;

    });

/* ============================================================

 * ============================================================ */
const TILE_SERVERS = ['1','2','3','4']; // 高德瓦片子域(webrd01~webrd04)
function tileUrl(s, x, y, z) {
  return `https://webrd0${s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=${x}&y=${y}&z=${z}`;
}
function lngLatToTileXY(lng, lat, z) {
  const n = Math.pow(2, z);
  const xTile = (lng + 180) / 360 * n;
  const latRad = lat * Math.PI / 180;
  const yTile = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  return [xTile, yTile];
}
// Canvas 方案:把瓦片绘制到 canvas,绝对无缝、不失真
function loadTileCanvas(bounds, z) {
  return new Promise((resolve) => {
    const [xMinT, yMinT] = lngLatToTileXY(bounds.minLng, bounds.maxLat, z);
    const [xMaxT, yMaxT] = lngLatToTileXY(bounds.maxLng, bounds.minLat, z);
    const x0 = Math.floor(xMinT), x1 = Math.max(Math.floor(xMaxT), x0 + 1);
    const y0 = Math.floor(yMinT), y1 = Math.max(Math.floor(yMaxT), y0 + 1);
    const tilesW = x1 - x0 + 1, tilesH = y1 - y0 + 1;
    const canvas = document.createElement('canvas');
    canvas.width = tilesW * 256;
    canvas.height = tilesH * 256;
    const ctx = canvas.getContext('2d');
    const project = (lng, lat) => {
      const [xt, yt] = lngLatToTileXY(lng, lat, z);
      return [(xt - x0) * 256, (yt - y0) * 256];
    };
    let loaded = 0;
    const total = tilesW * tilesH;
    let itemIdx = 0;
    for (let tx = x0; tx <= x1; tx++) {
      for (let ty = y0; ty <= y1; ty++) {
        const s = TILE_SERVERS[itemIdx % TILE_SERVERS.length]; itemIdx++;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          ctx.drawImage(img, (tx - x0) * 256, (ty - y0) * 256, 256, 256);
          loaded++;
          if (loaded >= total) {
            resolve({ url: canvas.toDataURL('image/png'), project, canvasW: canvas.width, canvasH: canvas.height });
          }
        };
        img.onerror = () => {
          loaded++;
          // 失败瓦片保持透明,由底色承接
          if (loaded >= total) {
            resolve({ url: canvas.toDataURL('image/png'), project, canvasW: canvas.width, canvasH: canvas.height });
          }
        };
        img.src = tileUrl(s, tx, ty, z);
      }
    }
    // 兜底:万一所有瓦片都失败,也返回 canvas
    setTimeout(() => {
      resolve({ url: canvas.toDataURL('image/png'), project, canvasW: canvas.width, canvasH: canvas.height });
    }, 4000);
  });
}

// 计算一个能覆盖所有点的 bounds;可选强制纵横比(避免跨城日拉成超长竖条)
// aspectRatio = null:自然 bounds; = 数字 (canvasW/canvasH):
//   调整使 lngSpan/latSpan ≈ aspectRatio * cos(midLat) (墨卡托投影补偿)
function calcBounds(points, pad = 0.15, aspectRatio = null) {
  const lats = points.map(p => p.lat);
  const lngs = points.map(p => p.lng);
  let minLat = Math.min(...lats), maxLat = Math.max(...lats);
  let minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  if (maxLat === minLat) { maxLat += 0.01; minLat -= 0.01; }
  if (maxLng === minLng) { maxLng += 0.01; minLng -= 0.01; }
  let dLat = (maxLat - minLat) * pad || 0.05;
  let dLng = (maxLng - minLng) * pad || 0.05;
  minLat -= dLat; maxLat += dLat;
  minLng -= dLng; maxLng += dLng;
  if (aspectRatio) {
    const latSpan = maxLat - minLat;
    const lngSpan = maxLng - minLng;
    const midLat = (maxLat + minLat) / 2;
    const k = Math.cos(midLat * Math.PI / 180); // 墨卡托 cos 补偿
    // 视觉 canvas w/h = aspectRatio,等价于 lngSpan/latSpan = aspectRatio * k
    const targetRatio = aspectRatio * k;
    const currentRatio = lngSpan / latSpan;
    if (currentRatio < targetRatio) {
      // lng 太窄:横向扩展 lng
      const newLngSpan = latSpan * targetRatio;
      const extra = (newLngSpan - lngSpan) / 2;
      minLng -= extra; maxLng += extra;
    } else {
      // lng 太宽:纵向扩展 lat
      const newLatSpan = lngSpan / targetRatio;
      const extra = (newLatSpan - latSpan) / 2;
      minLat -= extra; maxLat += extra;
    }
  }
  return { minLat, maxLat, minLng, maxLng };
}
// 按 bounds 精确选 zoom:遍历 z,计算实际瓦片网格数,取第一个 ≤ maxTiles 的 z
function pickZoomBySpan(bounds, maxTiles = 36, minZoom = 4) {
  for (let z = 15; z >= minZoom; z--) {
    const n = Math.pow(2, z);
    const toRad = d => d * Math.PI / 180;
    const x0 = Math.floor((bounds.minLng + 180) / 360 * n);
    const x1 = Math.floor((bounds.maxLng + 180) / 360 * n);
    const y0 = Math.floor((1 - Math.log(Math.tan(toRad(bounds.maxLat)) + 1/Math.cos(toRad(bounds.maxLat))) / Math.PI) / 2 * n);
    const y1 = Math.floor((1 - Math.log(Math.tan(toRad(bounds.minLat)) + 1/Math.cos(toRad(bounds.minLat))) / Math.PI) / 2 * n);
    const tilesW = x1 - x0 + 1;
    const tilesH = y1 - y0 + 1;
    if (tilesW * tilesH <= maxTiles) return z;
  }
  return minZoom;
}

/* ============================================================
 *  渲染:总览地图(高德真地图 + 按天切换/多选路线)
 *  已预留酒店/车站坐标:后续订好后,往 EXTRA_POINTS 里填即可
 * ============================================================ */
const PLACES = {
  hz:  { name: "杭州西",   lat: 30.2919, lng: 120.0253, kind: "station" },
  sr:  { name: "上饶",     lat: 28.4912, lng: 117.9522, kind: "city" },
  wy:  { name: "婺源",     lat: 29.2541, lng: 117.8611, kind: "city" },
  jdz: { name: "景德镇",   lat: 29.2940, lng: 117.2080, kind: "city" },
  gxs: { name: "葛仙山",   lat: 28.1316, lng: 117.6811, kind: "scene" },
  tbs: { name: "铜钹山",   lat: 28.3617, lng: 118.1861, kind: "scene" },
  hl:  { name: "篁岭",     lat: 29.3519, lng: 117.8358, kind: "scene" },
  wnz: { name: "婺女洲",   lat: 29.2651, lng: 117.8671, kind: "scene" },
  taog: { name: "陶溪川",  lat: 29.2955, lng: 117.2196, kind: "scene" }
};

// 预留:酒店/车站订好后,把坐标填这里,地图会自动显示
// 格式: { name, lat, lng, kind: "hotel" | "station", day: "d1" }
const EXTRA_POINTS = [
  // { name: "葛仙山镇民宿", lat: 28.13, lng: 117.68, kind: "hotel", day: "d1" },
];

const ROUTE_SEQ = {
  d1: { path: ["hz","sr","gxs"] },
  d2: { path: ["gxs","tbs","sr"] },
  d3: { path: ["sr","wy","hl","wnz","wy"] },
  d4: { path: ["wy","jdz","taog"] },
  d5: { path: ["jdz","jdz","hz"] }
};

let overviewState = new Set(TRIP.days.map(d => d.id)); // 默认全选

function renderOverviewDays() {
  const host = $("#overviewDays");
  const chips = TRIP.days.map(d => {
    const active = overviewState.has(d.id);
    return `<button class="day-chip ${active?'active':''}" data-day-chip="${d.id}" style="${active?`background:${d.color};border-color:${d.color};`:''}">${d.label}</button>`;
  }).join('');
  host.innerHTML = chips + `<span class="day-chip hint">点选天 / 可多选</span>`;

  $$('.day-chip[data-day-chip]', host).forEach(chip => {
    chip.addEventListener('click', () => {
      const id = chip.dataset.dayChip;
      if (overviewState.has(id)) {
        if (overviewState.size > 1) overviewState.delete(id);
      } else {
        overviewState.add(id);
      }
      renderOverviewDays();
      renderOverviewSVG();
    });
  });
}

async function renderOverviewSVG() {
  const W = 800, H = 1000;
  // 计算 bounds:包含所有 TRIP 城市 + 当前选中天涉及的景点 + 预留点
  const involvedKeys = new Set();
  TRIP.days.filter(d => overviewState.has(d.id)).forEach(d => {
    ROUTE_SEQ[d.id].path.forEach(k => involvedKeys.add(k));
  });
  const pts = [];
  involvedKeys.forEach(k => {
    const p = PLACES[k];
    if (p) pts.push({ name: p.name, lat: p.lat, lng: p.lng, key: k });
  });
  EXTRA_POINTS.forEach(p => pts.push(p));
  if (pts.length === 0) {
    $("#overviewSvg").innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted);">至少选一天</div>`;
    return;
  }
  const bounds = calcBounds(pts, 0.15);
  const z = pickZoomBySpan(bounds, 42); // 总览:控制瓦片数量
  const { url, project, canvasW, canvasH } = await loadTileCanvas(bounds, z);

  // 路线(仅画选中天):白色外边阴影 + 主色,虚线表达"行程计划"
  const lines = TRIP.days.filter(d => overviewState.has(d.id)).map(d => {
    const seq = ROUTE_SEQ[d.id].path;
    const segs = [];
    for (let i = 0; i < seq.length - 1; i++) {
      const a = PLACES[seq[i]], b = PLACES[seq[i+1]];
      if (!a || !b) continue;
      const [ax, ay] = project(a.lng, a.lat);
      const [bx, by] = project(b.lng, b.lat);
      const mx = (ax + bx) / 2 + (ay - by) * 0.05;
      const my = (ay + by) / 2 + (bx - ax) * 0.05;
      // 白色外边阴影
      segs.push(`<path d="M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.85"/>`);
      // 主色虚线
      segs.push(`<path d="M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}" stroke="${d.color}" stroke-width="5" fill="none" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/>`);
    }
    return segs.join('');
  }).join('');

  // 节点:加大、加粗描边,文字加白色描边阴影
  const cityKeys = new Set(["hz","sr","wy","jdz"]);
  const dots = pts.filter(p => p.key).map(p => {
    const [x, y] = project(p.lng, p.lat);
    const isCity = cityKeys.has(p.key);
    if (isCity) {
      return `<g><circle cx="${x}" cy="${y}" r="16" fill="var(--accent)" opacity="0.95" stroke="#fff" stroke-width="4"/><circle cx="${x}" cy="${y}" r="7" fill="#fff"/><text x="${x}" y="${y+34}" text-anchor="middle" font-size="17" font-weight="700" fill="var(--fg)" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">${p.name}</text></g>`;
    }
    return `<g><circle cx="${x}" cy="${y}" r="9" fill="${dayColorOfStop(p.key)}" stroke="#fff" stroke-width="3"/><text x="${x+13}" y="${y+5}" font-size="14" font-weight="600" fill="var(--fg)" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">${p.name}</text></g>`;
  }).join('');

  // 预留酒店/车站
  const extraDots = pts.filter(p => !p.key).map(p => {
    const [x, y] = project(p.lng, p.lat);
    const isHotel = p.kind === 'hotel';
    const shape = isHotel
      ? `<rect x="${x-9}" y="${y-9}" width="18" height="18" rx="3" fill="var(--warn)" stroke="#fff" stroke-width="3"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">住</text>`
      : `<circle cx="${x}" cy="${y}" r="10" fill="var(--accent)" stroke="#fff" stroke-width="3"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">车</text>`;
    return `<g>${shape}<text x="${x}" y="${y-14}" text-anchor="middle" font-size="12" fill="var(--fg)" paint-order="stroke" stroke="#fff" stroke-width="4">${p.name}</text></g>`;
  }).join('');

  // 底图降透明度 + 降饱和,作为背景而不是主角
  $("#overviewSvg").innerHTML = `<svg viewBox="0 0 ${canvasW} ${canvasH}" preserveAspectRatio="xMidYMid meet"><image href="${url}" x="0" y="0" width="${canvasW}" height="${canvasH}" opacity="0.5" style="filter:saturate(0.55) brightness(1.05);"/>${lines}${dots}${extraDots}</svg>`;

  $("#overviewLegend").innerHTML = TRIP.days.map(d => {
    const on = overviewState.has(d.id);
    return `<span class="legend-item" style="${on?'':'opacity:.4;'}"><span class="legend-dot" style="background:${d.color}"></span>${d.label} · ${d.route}</span>`;
  }).join('');
}

function dayColorOfStop(key) {
  for (const d of TRIP.days) {
    if (ROUTE_SEQ[d.id].path.includes(key)) return d.color;
  }
  return "var(--accent)";
}

/* ============================================================
 *  渲染:当日路线图(高德真地图,景点到景点)
 * ============================================================ */
async function renderDayRouteSVG(dayId) {
  const d = TRIP.days.find(x => x.id === dayId);
  if (!d) return '';
  // 收集当日所有有坐标的点(含酒店/车站预留点的 day 匹配)
  const pts = d.events
    .filter(ev => ev.lat != null)
    .map((ev, i) => ({ name: ev.place || ev.title, lat: ev.lat, lng: ev.lng, idx: i, kind: "scene" }));
  const hotelForDay = EXTRA_POINTS.find(p => p.day === d.id && p.kind === "hotel");
  if (hotelForDay) pts.push({ name: hotelForDay.name, lat: hotelForDay.lat, lng: hotelForDay.lng, kind: "hotel" });
  const stationForDay = EXTRA_POINTS.find(p => p.day === d.id && p.kind === "station");
  if (stationForDay) pts.push({ name: stationForDay.name, lat: stationForDay.lat, lng: stationForDay.lng, kind: "station" });
  if (pts.length < 1) return '<div style="padding:40px;text-align:center;color:var(--muted);">暂无定位点</div>';

  // 计算 bounds:强制纵横比 4:3(避免跨城日拉成超长竖条),提高最小 zoom 让细节清晰
  const bounds = calcBounds(pts, 0.18, 4 / 3);
  const z = pickZoomBySpan(bounds, 30, 10);
  const { url, project, canvasW, canvasH } = await loadTileCanvas(bounds, z);

  // 路线:加白色描边阴影 + 主色更粗,让路线在底图上更突出
  const pathCoords = pts.map(p => project(p.lng, p.lat));
  let lines = '';
  for (let i = 0; i < pathCoords.length - 1; i++) {
    const [ax, ay] = pathCoords[i], [bx, by] = pathCoords[i+1];
    // 外白边 + 内主色双层描边,形成路线"发光"效果
    lines += `<path d="M ${ax} ${ay} L ${bx} ${by}" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.85"/>`;
    lines += `<path d="M ${ax} ${ay} L ${bx} ${by}" stroke="${d.color}" stroke-width="6" fill="none" stroke-linecap="round" opacity="1"/>`;
  }

  // 节点:加大圆圈 + 加粗描边,编号圈根据上下左右错位避免重叠
  // 计算每个点的锚点方向(自动选右/左/上/下,让标注远离路线)
  // ===== 防重叠标注布局 =====
  // 依赖坐标相近的点聚集判定(同地点多个时段,或景点紧邻),
  // 给同一簇内的点分配不同展开方向 + 递增偏移半径,螺旋展开避免文字叠加
  const clusterDist = 95; // 坐标间距小于该值(px)视为同簇
  const clusters = [];    // 每项 { pts:[索引...], rect }
  const clusterOf = new Array(pts.length).fill(-1);
  pts.forEach((p, i) => {
    if (clusterOf[i] >= 0) return;
    const [cx, cy] = project(p.lng, p.lat);
    const members = [i];
    for (let j = i + 1; j < pts.length; j++) {
      if (clusterOf[j] >= 0) continue;
      const [px, py] = project(pts[j].lng, pts[j].lat);
      if (Math.hypot(px - cx, py - cy) < clusterDist) members.push(j);
    }
    const cid = clusters.length;
    members.forEach(m => clusterOf[m] = cid);
    clusters.push(members);
  });

  // 为簇内每个成员分配一个展开方向(0右 1上 2左 3下,循环)+ 偏移环数
  const dirAngles = [0, -90, 180, 90];   // 度(0=右侧,逆时针)
  const RING_STEP = 30;                  // 每环增加偏移(px)
  function labelPlacement(i) {
    const [x, y] = project(pts[i].lng, pts[i].lat);
    const cid = clusterOf[i];
    const members = clusters[cid];
    const ord = members.indexOf(i);      // 簇内第几个
    const angle = dirAngles[ord % 4] * Math.PI / 180;
    const ring = Math.floor(ord / 4);    // 第几环(0,1,2...)
    const R = 14;
    // 基础偏移往外推,带动文字远离中心
    const anchorDist = R + 10 + ring * RING_STEP;
    const dx = Math.cos(angle) * anchorDist;
    const dy = Math.sin(angle) * anchorDist;
    let lx = x + dx, ly = y + dy;
    let anchor = 'middle';
    if (angle > -Math.PI/4 && angle < Math.PI/4) anchor = 'start';          // 右侧
    else if (angle > Math.PI*3/4 || angle < -Math.PI*3/4) anchor = 'end';   // 左侧
    else anchor = 'middle';                                                   // 上/下
    // 文字基线微调(上边需抬高,文字底边对齐)
    if (Math.abs(Math.sin(angle)) > 0.7) ly = y + dy * 0.6; // 上/下:文字更靠近点
    return { x, y, lx, ly, anchor };
  }

  const dots = pts.map((p, i) => {
    const [x, y] = project(p.lng, p.lat);
    const place = labelPlacement(i);
    let shape;
    const R = 14;
    const STROKE = 4;
    if (p.kind === "hotel") {
      shape = `<rect x="${x-R}" y="${y-R}" width="${R*2}" height="${R*2}" rx="4" fill="var(--warn)" stroke="#fff" stroke-width="${STROKE}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">住</text>`;
    } else if (p.kind === "station") {
      shape = `<circle cx="${x}" cy="${y}" r="${R}" fill="var(--accent)" stroke="#fff" stroke-width="${STROKE}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">车</text>`;
    } else {
      shape = `<circle cx="${x}" cy="${y}" r="${R}" fill="${d.color}" stroke="#fff" stroke-width="${STROKE}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${i+1}</text>`;
    }
    // 文字底板:白底 + 彩色描边,字号加大 14,宽随字数
    const txtW = Math.max(42, p.name.length * 9 + 16);
    const ly2 = place.anchor === 'middle' ? place.ly + 5 : place.ly;
    const lx2 = place.anchor === 'middle' ? place.lx : (place.anchor === 'start' ? place.lx : place.lx);
    const rectX = place.anchor === 'start' ? lx2 - 4 : (place.anchor === 'end' ? lx2 - txtW + 4 : lx2 - txtW/2);
    const rectY = ly2 - 13;
    const labelHtml = `<g><rect x="${rectX}" y="${rectY}" width="${txtW}" height="20" rx="5" fill="#ffffff" opacity="0.94" stroke="${d.color}" stroke-width="2"/><text x="${lx2}" y="${ly2}" font-size="14" font-weight="600" fill="var(--fg)" text-anchor="${place.anchor}">${p.name}</text></g>`;
    return `<g>${shape}${labelHtml}</g>`;
  }).join('');

  // 包一层 .map-stage 提供 4:3 固定容器 + 缩放控件 + 手势
  const svgId = `day-svg-${dayId}`;
  return `
    <div class="map-stage" data-map-stage>
        <svg id="${svgId}" data-day-svg="${dayId}" viewBox="0 0 ${canvasW} ${canvasH}" preserveAspectRatio="xMidYMid meet">
          <!-- 底图降透明度 + 降饱和,作为背景而不是主角 -->
          <image href="${url}" x="0" y="0" width="${canvasW}" height="${canvasH}" opacity="0.5" style="filter:saturate(0.55) brightness(1.05);"/>
          ${lines}${dots}
        </svg>
        <div class="map-zoom-hint">双指缩放 · 拖动平移</div>
        <div class="map-zoom-controls">
          <button type="button" data-zoom-act="in" aria-label="放大">+</button>
          <button type="button" data-zoom-act="out" aria-label="缩小">−</button>
          <button type="button" data-zoom-act="reset" aria-label="还原" style="font-size:11px;">⟲</button>
        </div>
      </div>`;
}

/* ============================================================
 *  主题切换
 * ============================================================ */
function initTheme() {
  const saved = localStorage.getItem('trip-theme');
  const btn = $("#themeToggle");
  const apply = (mode) => {
    document.documentElement.setAttribute('data-theme', mode);
    btn.textContent = mode === 'dark' ? '☀' : '☾';
  };
  if (saved) { apply(saved); }
  else { document.documentElement.setAttribute('data-theme', 'auto'); btn.textContent = '◐'; }

  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    let next;
    if (cur === 'auto') next = 'light';
    else if (cur === 'light') next = 'dark';
    else next = 'auto';
    localStorage.setItem('trip-theme', next);
    apply(next);
  });
}

/* ============================================================
 *  灵动岛:下拉缩小悬浮,点击展开/收起
 * ============================================================ */
function initDynamicIsland() {
  const header = $("#nextUp");
  let islandThreshold = 60;
  let isIsland = false;
  let isExpanded = false;
  let ticking = false;

  function update() {
    const y = window.scrollY;
    const shouldIsland = y > islandThreshold;
    if (shouldIsland !== isIsland) {
      isIsland = shouldIsland;
      header.classList.toggle('is-island', isIsland);
      if (isIsland) isExpanded = false;
      header.classList.toggle('is-expanded', false);
    }
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  }, { passive: true });

  header.addEventListener('click', (e) => {
    // 只有灵动岛悬浮态才响应点击展开/收起
    if (!isIsland) return;
    e.preventDefault();
    isExpanded = !isExpanded;
    header.classList.toggle('is-expanded', isExpanded);
  });
}

/* ============================================================
 *  待办:默认按时间智能收起/展开,用户可手动切换
 *  出发前(>= 当前日期 < 出发日): 展开
 *  出发日及之后: 默认收起
 *  用户手动切换会覆盖默认值,localStorage 记忆
 * ============================================================ */
function initTodoCollapse() {
  const section = $("#todoSection");
  const btn = $("#todoToggle");
  if (!section || !btn) return;
  const saved = localStorage.getItem('trip-todo-collapsed');
  let collapsed;
  if (saved !== null) {
    collapsed = saved === '1';
  } else {
    // 默认:出发日及之后自动收起(让用户专注行程);出发前显示
    const now = Date.now();
    const start = +new Date(TRIP.startDate + 'T00:00:00+08:00');
    collapsed = now >= start;
  }
  const apply = (c) => {
    section.classList.toggle('is-collapsed', c);
    btn.setAttribute('aria-expanded', String(!c));
  };
  apply(collapsed);
  btn.addEventListener('click', () => {
    collapsed = !collapsed;
    localStorage.setItem('trip-todo-collapsed', collapsed ? '1' : '0');
    apply(collapsed);
  });
}

/* ============================================================
 *  每日路线地图:手势交互(双指缩放 / 单指拖动 / 滚轮 / 按钮)
 *  viewBox-based:精度比 CSS transform 高
 * ============================================================ */
function initMapInteractions(stage) {
  const svg = stage.querySelector('svg[data-day-svg]');
  if (!svg) return;
  const initialViewBox = svg.getAttribute('viewBox').split(/\s+/).map(Number);
  let [vx, vy, vw, vh] = initialViewBox;
  const MIN_SCALE = 0.25;   // 最大放大 4x(细看)
  const MAX_SCALE = 1;      // 不允许缩小到比初始还小
  let pointers = new Map(); // pointerId -> {x,y}
  let pinchStart = null;     // 双指初始距离 + 初始 viewBox
  let panStart = null;       // 单指拖动初始状态
  let lastTap = 0;

  const apply = () => svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);

  const screenToSvg = (clientX, clientY) => {
    const r = svg.getBoundingClientRect();
    return {
      x: vx + ((clientX - r.left) / r.width) * vw,
      y: vy + ((clientY - r.top) / r.height) * vh,
    };
  };
  const scaleAt = (clientX, clientY, factor) => {
    // 以(clientX, clientY)为中心缩放 factor 倍(factor<1 放大)
    const focus = screenToSvg(clientX, clientY);
    const newW = vw * factor, newH = vh * factor;
    vx = focus.x - ((clientX - svg.getBoundingClientRect().left) / svg.getBoundingClientRect().width) * newW;
    vy = focus.y - ((clientY - svg.getBoundingClientRect().top) / svg.getBoundingClientRect().height) * newH;
    vw = newW; vh = newH;
    clamp(); apply();
  };
  const clamp = () => {
    if (vw < initialViewBox[2] * MIN_SCALE) {
      const f = (initialViewBox[2] * MIN_SCALE) / vw;
      vw *= f; vh *= f;
      // 中心点不变,直接按比例收缩
    }
    if (vw > initialViewBox[2] * MAX_SCALE) {
      const f = (initialViewBox[2] * MAX_SCALE) / vw;
      vx += (vw - initialViewBox[2]) / 2;
      vy += (vh - initialViewBox[3]) / 2;
      vw *= f; vh *= f;
    }
  };

  // 滚轮缩放(PC)
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
    scaleAt(e.clientX, e.clientY, factor);
  }, { passive: false });

  // 触屏
  stage.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      panStart = { vx, vy, x: e.clientX, y: e.clientY, moved: false };
    } else if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      pinchStart = {
        dist: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y),
        vw, vh, vx, vy,
        cx: (pts[0].x + pts[1].x) / 2,
        cy: (pts[0].y + pts[1].y) / 2,
      };
      panStart = null; // 双指时暂停单指拖动
      svg.classList.add('dragging');
    }
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && pinchStart) {
      const pts = Array.from(pointers.values());
      const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      const factor = pinchStart.dist / dist; // dist 变小 -> factor>1 放大(vw 变小)
      // 双指中心点
      const cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
      // 在 pinch 起始 viewBox 上应用新比例,以中点为锚
      const focus = { x: pinchStart.vx + ((cx - svg.getBoundingClientRect().left) / svg.getBoundingClientRect().width) * pinchStart.vw,
                       y: pinchStart.vy + ((cy - svg.getBoundingClientRect().top) / svg.getBoundingClientRect().height) * pinchStart.vh };
      const newW = pinchStart.vw * factor, newH = pinchStart.vh * factor;
      vx = focus.x - ((cx - svg.getBoundingClientRect().left) / svg.getBoundingClientRect().width) * newW;
      vy = focus.y - ((cy - svg.getBoundingClientRect().top) / svg.getBoundingClientRect().height) * newH;
      vw = newW; vh = newH;
      clamp(); apply();
    } else if (pointers.size === 1 && panStart) {
      const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
      if (!panStart.moved && Math.hypot(dx, dy) > 4) { panStart.moved = true; svg.classList.add('dragging'); }
      if (panStart.moved) {
        const r = svg.getBoundingClientRect();
        vx = panStart.vx - (dx / r.width) * vw;
        vy = panStart.vy - (dy / r.height) * vh;
        apply();
      }
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0) {
      // 双击检测
      const now = Date.now();
      if (now - lastTap < 300 && panStart && !panStart.moved) {
        // 双击切换缩放
        const cur = vw;
        if (cur > initialViewBox[2] * 0.6) {
          scaleAt(e.clientX, e.clientY, 0.5); // 放大
        } else {
          vx = initialViewBox[0]; vy = initialViewBox[1]; vw = initialViewBox[2]; vh = initialViewBox[3]; apply(); // 还原
        }
      }
      lastTap = now;
      panStart = null;
      setTimeout(() => svg.classList.remove('dragging'), 50);
    }
  };
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);

  // 缩放按钮
  stage.querySelectorAll('[data-zoom-act]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const act = btn.dataset.zoomAct;
      if (act === 'in')  scaleAt(cx, cy, 0.7);
      else if (act === 'out') scaleAt(cx, cy, 1.3);
      else { vx = initialViewBox[0]; vy = initialViewBox[1]; vw = initialViewBox[2]; vh = initialViewBox[3]; apply(); }
    });
  });
}

/* ============================================================
 *  init
 * ============================================================ */
function init() {
  renderNextUp();
  renderBookings();
  renderDays();
  renderOverviewDays();
  renderOverviewSVG();
  renderTodo();
  renderTips();
  initTheme();
  initDynamicIsland();
  initTodoCollapse();
  setInterval(renderNextUp, 1000);
}
document.addEventListener('DOMContentLoaded', init);
</script>
